# Dev/test sandbox. Usage: npm run sandbox (builds the panel first), then open http://localhost:8080
# Password: sandbox-password (override with PANEL_PASSWORD).
name: mc-server-panel-sandbox

services:
  panel:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${SANDBOX_PORT:-8080}:8080"
    environment:
      PANEL_PASSWORD: ${PANEL_PASSWORD:-sandbox-password}
      SERVER_NAME: ${SERVER_NAME:-Sandbox Server}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 2s
      timeout: 2s
      retries: 30
